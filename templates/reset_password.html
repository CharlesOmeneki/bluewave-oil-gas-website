<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | ClassyPorn</title>
  <style>
    body {
      background-color: #1c1c1c;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 400px;
      margin: 80px auto;
      background: #333;
      padding: 20px;
      border-radius: 8px;
    }
    h1 {
      text-align: center;
      color: #ff9900;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    label {
      margin: 10px 0 5px;
    }
    input {
      padding: 10px;
      border-radius: 4px;
      border: none;
      margin-bottom: 15px;
    }
    .password-container {
      position: relative;
    }
    .toggle-password {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      cursor: pointer;
      color: #777;
    }
    button {
      padding: 10px;
      margin-top: 20px;
      border: none;
      border-radius: 4px;
      background-color: #ff9900;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #e68a00;
    }
    /* Success message styling */
    .success-message {
      background-color: #dff0d8;
      color: #3c763d;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      font-size: 16px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Reset Password</h1>
    
    {% if success %}
      <div class="success-message">
        Your password has been changed successfully! Redirecting to login page...
      </div>
      <script>
        // Redirect to login page after 3 seconds
        setTimeout(function(){
          window.location.href = "{{ url_for('login') }}";
        }, 3000);
      </script>
    {% else %}
      <form action="" method="POST">
        <label for="password">New Password</label>
        <div class="password-container">
          <input type="password" name="password" id="password" placeholder="New Password" required>
          <span class="toggle-password" onclick="togglePassword('password', 'toggleIcon1')">
            <i id="toggleIcon1" class="fa fa-eye"></i>
          </span>
        </div>
        <label for="confirm_password">Confirm New Password</label>
        <div class="password-container">
          <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm Password" required>
          <span class="toggle-password" onclick="togglePassword('confirm_password', 'toggleIcon2')">
            <i id="toggleIcon2" class="fa fa-eye"></i>
          </span>
        </div>
        <button type="submit">Change Password</button>
      </form>
    {% endif %}
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script>
    function togglePassword(inputId, iconId) {
      var inputField = document.getElementById(inputId);
      var toggleIcon = document.getElementById(iconId);
      if (inputField.type === "password") {
        inputField.type = "text";
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      } else {
        inputField.type = "password";
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      }
    }
  </script>
</body>
</html>
