<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password | ClassyPorn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #1c1c1c;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 400px;
      margin: 80px auto;
      background: #333;
      padding: 20px;
      border-radius: 8px;
    }
    h1 {
      text-align: center;
      color: #ff9900;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    label {
      margin: 10px 0 5px;
    }
    input {
      padding: 10px;
      border-radius: 4px;
      border: none;
    }
    button {
      padding: 10px;
      margin-top: 20px;
      border: none;
      border-radius: 4px;
      background-color: #ff9900;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #e68a00;
    }
    /* Flash message styles */
    .flash {
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      text-align: center;
      font-size: 14px;
    }
    .flash.success {
      background-color: #dff0d8;
      color: #3c763d;
    }
    .flash.error {
      background-color: #f2dede;
      color: #a94442;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Forgot Password</h1>

    <!-- Display flashed messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/forgot_password" method="POST">
      <label for="email">Enter your email address</label>
      <input type="email" name="email" id="email" placeholder="youremail@example.com" required>
      <button type="submit">Reset Password</button>
    </form>
  </div>
</body>
</html>
