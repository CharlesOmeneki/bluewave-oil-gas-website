<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Your Password</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
    }
    .button {
      display: inline-block;
      padding: 10px 20px;
      background: #ff9900;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Hello {{ username }},</h2>
    <p>You recently requested to reset your password for ClassyPorn. Click the button below to reset it. This link is valid for 1 hour.</p>
    <p><a class="button" href="{{ reset_url }}">Reset Password</a></p>
    <p>If you did not request a password reset, please ignore this email.</p>
  </div>
</body>
</html>
