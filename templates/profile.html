<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | ClassyPorn</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* General Styles */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #1c1c1c;
      color: #fff;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    /* Upload/Profile Section */
    .upload-box {
      border: 2px dashed #ff9900;
      padding: 40px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }
    .upload-box h2 {
      margin-top: 0;
      color: #ff9900;
    }
    .profile-photo {
      margin: 20px auto;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 4px solid #ff9900;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
      position: relative;
    }
    .profile-photo img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .no-photo {
      color: #fff;
      font-size: 16px;
    }
    .remove-photo {
      position: absolute;
      top: 50%;
      right: 0;
      transform: translate(50%, -50%);
      background: #ff9900;
      border-radius: 50%;
      padding: 5px;
      cursor: pointer;
    }
    .remove-photo i {
      color: #fff;
      font-size: 16px;
    }
    .upload-box input[type="file"] {
      margin-top: 20px;
      padding: 10px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      color: #333;
    }
    .upload-box button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #e50914;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
    }
    .upload-box button:hover {
      background-color: #bf0810;
    }
    /* Navigation Bar */
    .tab-bar {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      border-top: 1px solid #444;
      padding-top: 10px;
    }
    .tab-item {
      flex: 1;
      text-align: center;
      text-decoration: none;
      color: #fff;
      padding: 10px;
      position: relative;
    }
    .tab-item:hover {
      color: #ff9900;
    }
    .tab-item i {
      font-size: 24px;
      position: relative;
      display: inline-block;
    }
    .tab-item span {
      display: block;
      font-size: 14px;
      margin-top: 5px;
    }
    /* Notification Badge Styles inside the bell icon */
    #notificationBellBadge {
      position: absolute;
      top: 0;
      right: 0;
      transform: translate(50%, -50%);
      background-color: red;
      color: #fff;
      border-radius: 50%;
      padding: 2px 6px;
      font-size: 12px;
    }
    /* Chat Notification Banner */
    #chatNotification {
      display: none;
      margin: 10px 0;
      background-color: #ff9900;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      font-size: 14px;
      color: #000;
    }
    /* Profile Actions Row */
    .profile-actions {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
    }
    .action-btn {
      padding: 10px 20px;
      background-color: #fff;
      color: #333;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .action-btn:hover {
      background-color: #f0f0f0;
    }
    .action-icon {
      position: relative;
      width: 40px;
      height: 40px;
      background-color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .action-icon i {
      color: #333;
      font-size: 20px;
    }
    .icon-cross {
      position: absolute;
      top: -5px;
      right: -5px;
      background-color: #ff9900;
      color: #fff;
      border-radius: 50%;
      padding: 2px;
      font-size: 10px;
      line-height: 1;
    }
    /* Profile Bio Section */
    .profile-bio {
      margin-top: 20px;
      text-align: center;
      font-size: 16px;
      color: #ff9900;
    }
    /* Media Grid Section */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin-top: 30px;
    }
    .media-item {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border: 2px solid #ff9900;
      border-radius: 5px;
      transition: transform 0.3s;
      cursor: pointer;
    }
    .media-item:hover {
      transform: scale(1.05);
    }
    /* Full Screen Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 3000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.9);
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      max-width: 90vw;
      max-height: 90vh;
      background-color: #000;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 10px;
      right: 25px;
      color: #fff;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
      z-index: 4000;
    }
    .modal-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
    }
    .modal-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .image-actions {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      background-color: #000;
      padding: 10px;
      gap: 20px;
    }
    .image-actions div,
    .image-actions button {
      background: none;
      border: none;
      color: #ff9900;
      font-size: 16px;
      cursor: pointer;
    }
    .image-actions div:hover,
    .image-actions button:hover {
      color: #ffa733;
    }
    /* Share Options Panel */
    .share-options {
      background-color: #222;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .share-options a,
    .share-options button {
      color: #ff9900;
      text-decoration: none;
      background: none;
      border: 1px solid #ff9900;
      border-radius: 4px;
      padding: 5px;
      text-align: center;
    }
    .share-options a:hover,
    .share-options button:hover {
      background-color: #ff9900;
      color: #000;
    }
    /* Updated Media Options Modal Styles */
    #mediaModal {
      display: none;
      position: fixed;
      z-index: 3000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.75);
      align-items: center;
      justify-content: center;
    }
    .media-modal-card {
      background-color: #222;
      border-radius: 8px;
      padding: 30px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      position: relative;
    }
    .media-modal-card h2 {
      margin-top: 0;
      color: #ff9900;
    }
    .media-modal-options {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 20px;
    }
    .media-option-btn {
      background-color: #ff9900;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .media-option-btn:hover {
      background-color: #e68a00;
    }
    .media-modal-card .modal-close {
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 28px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Profile Photo and Upload -->
    <div class="upload-box">
      <h2>{{ email }}</h2>
      <div class="profile-photo">
        {% if profile_photo %}
          <img id="profileImage" src="{{ profile_photo }}" alt="Profile Photo">
          <span class="remove-photo" onclick="triggerFileInput()"><i class="fa fa-plus"></i></span>
        {% else %}
          <div class="no-photo">No Photo Uploaded</div>
        {% endif %}
      </div>
      <form id="uploadForm" action="/upload_profile_photo" method="POST" enctype="multipart/form-data">
        <input type="file" id="profilePhotoInput" name="profile_photo" accept="image/*" style="{% if profile_photo %}opacity: 0; position: absolute; left: -9999px;{% endif %}">
      </form>
    </div>
    <!-- Navigation Bar -->
    <div class="tab-bar">
      <a href="/following" class="tab-item">
        <i class="fas fa-user-check"></i>
        <span>Following</span>
      </a>
      <a href="/followers" class="tab-item">
        <i class="fas fa-users"></i>
        <span>Followers</span>
      </a>
      <a href="/notifications" class="tab-item">
        <i class="fas fa-bell">
          <span id="notificationBellBadge">0</span>
        </i>
        <span>Notifications</span>
      </a>
    </div>
    <!-- Chat Notification Banner for Accepted Friend Requests -->
    <div id="chatNotification"></div>
    <!-- Profile Actions Row -->
    <div class="profile-actions">
      <button class="action-btn" onclick="window.location.href='/edit_profile'">Edit Profile</button>
      <button class="action-btn" onclick="window.location.href='/find_friends'">Find Friends</button>
      <div class="action-icon" onclick="openMediaOptions()">
        <i class="fas fa-user"></i>
        <span class="icon-cross"><i class="fa fa-plus"></i></span>
      </div>
    </div>
    <!-- Profile Bio Section -->
    <div class="profile-bio">
      {{ bio }}
    </div>
    <!-- Media Grid Section -->
    <div class="media-grid" id="mediaGrid">
      {% if media_list %}
        {% for media in media_list %}
          <img data-id="{{ media.id }}" src="{{ media.file_url }}" alt="Media" class="media-item" onclick="openImageModal({{ media.id }}, this.src)">
        {% endfor %}
      {% endif %}
    </div>
    <!-- Hidden file input for media upload -->
    <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;">
  </div>

  <!-- Full Screen Image Modal -->
  <div id="imageModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeImageModal()">&times;</span>
      <div class="modal-body">
        <img id="modalImage" src="" alt="Full Screen Media" class="modal-image">
      </div>
      <div class="image-actions">
        <div class="views">Views: <span id="viewCount">0</span></div>
        <div class="likes">Likes: <span id="likeCount">0</span></div>
        <div class="shares">Shares: <span id="shareCount">0</span></div>
        <button onclick="likeImage()"><i class="fas fa-heart"></i></button>
        <button onclick="commentImage()"><i class="fas fa-comment"></i></button>
        <button onclick="openShareOptions()"><i class="fas fa-share"></i></button>
        <button onclick="deleteImage()"><i class="fas fa-trash-alt"></i></button>
      </div>
      <!-- Share Options Panel (initially hidden) -->
      <div id="shareOptionsContainer" style="display:none;"></div>
    </div>
  </div>

  <!-- Updated Media Options Modal -->
  <div id="mediaModal" class="modal">
    <div class="media-modal-card">
      <span class="modal-close" onclick="closeMediaOptions()">&times;</span>
      <h2>Select Media Option</h2>
      <div class="media-modal-options">
        <button class="media-option-btn" onclick="openLiveCapture()">
          <i class="fas fa-camera"></i> Take Live Photo/Video
        </button>
        <button class="media-option-btn" onclick="uploadFromDevice()">
          <i class="fas fa-upload"></i> Upload from Device
        </button>
      </div>
    </div>
  </div>

  <!-- Live Capture Modal -->
  <div id="liveModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="modal-close" onclick="closeLiveModal()">&times;</span>
      <h2>Live Capture</h2>
      <video id="liveVideo" autoplay></video>
      <button onclick="captureLiveMedia()">Capture</button>
    </div>
  </div>

  <script>
    // Global variable for current media ID (used in image modal)
    let currentMediaId = null;

    // Trigger profile photo file input
    function triggerFileInput() {
      document.getElementById('profilePhotoInput').click();
    }
    document.getElementById('profilePhotoInput').addEventListener('change', function() {
      document.getElementById('uploadForm').submit();
    });

    // Media Options Modal functions
    function openMediaOptions() {
      document.getElementById('mediaModal').style.display = 'flex';
    }
    function closeMediaOptions() {
      document.getElementById('mediaModal').style.display = 'none';
    }

    // Upload from Device: trigger hidden media input
    function uploadFromDevice() {
      closeMediaOptions();
      document.getElementById('mediaInput').click();
    }

    // Handle media file selection and AJAX upload
    document.getElementById('mediaInput').addEventListener('change', function(event) {
      const files = event.target.files;
      const formData = new FormData();
      for (let i = 0; i < files.length; i++) {
        formData.append('media', files[i]);
      }
      fetch('/upload_media', {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          const mediaGrid = document.getElementById('mediaGrid');
          data.files.forEach(file => {
            const img = document.createElement('img');
            img.dataset.id = file.id;
            img.src = file.file_url;
            img.alt = "Media";
            img.className = "media-item";
            img.addEventListener('click', function() {
              openImageModal(file.id, this.src);
            });
            mediaGrid.appendChild(img);
          });
        } else {
          alert('Error uploading media: ' + data.error);
        }
      })
      .catch(error => console.error('Error:', error));
    });

    // Live Capture Modal functions
    let stream;
    function openLiveCapture() {
      closeMediaOptions();
      document.getElementById('liveModal').style.display = 'block';
      const video = document.getElementById('liveVideo');
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
          .then(function(s) {
            stream = s;
            video.srcObject = stream;
            video.play();
          })
          .catch(function(err) {
            alert("Error accessing camera: " + err);
          });
      }
    }
    function closeLiveModal() {
      document.getElementById('liveModal').style.display = 'none';
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    }
    function captureLiveMedia() {
      const video = document.getElementById('liveVideo');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataURL = canvas.toDataURL('image/png');
      const mediaGrid = document.getElementById('mediaGrid');
      const img = document.createElement('img');
      img.src = dataURL;
      img.alt = "Captured Media";
      img.className = "media-item";
      img.addEventListener('click', function() {
        openImageModal(null, this.src);
      });
      mediaGrid.appendChild(img);
      closeLiveModal();
    }

    // Image Modal functions
    function openImageModal(mediaId, src) {
      currentMediaId = mediaId;
      document.getElementById('modalImage').src = src;
      fetch('/increment_view_count', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ media_id: mediaId })
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('viewCount').innerText = data.views !== undefined ? data.views : 0;
        return fetch('/get_media_counts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ media_id: mediaId })
        });
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('likeCount').innerText = data.likes !== undefined ? data.likes : 0;
        document.getElementById('shareCount').innerText = data.shares !== undefined ? data.shares : 0;
      })
      .catch(error => console.error('Error updating view count:', error));
      document.getElementById('imageModal').style.display = "flex";
    }
    function closeImageModal() {
      document.getElementById('imageModal').style.display = "none";
      document.getElementById('shareOptionsContainer').style.display = 'none';
    }

    // Like functionality
    function likeImage() {
      fetch('/increment_like_count', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ media_id: currentMediaId })
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('likeCount').innerText = data.likes !== undefined ? data.likes : 0;
      })
      .catch(error => console.error('Error updating like count:', error));
    }

    // Share functionality: Open share options panel
    function openShareOptions() {
      const mediaUrl = document.getElementById('modalImage').src;
      const encodedUrl = encodeURIComponent(mediaUrl);
      const shareHTML = 
        '<div class="share-options">' +
          '<button onclick="sharePhoto(\'whatsapp\', \'' + encodedUrl + '\')">WhatsApp</button>' +
          '<button onclick="sharePhoto(\'facebook\', \'' + encodedUrl + '\')">Facebook</button>' +
          '<button onclick="sharePhoto(\'twitter\', \'' + encodedUrl + '\')">Twitter</button>' +
          '<button onclick="copyLink(\'' + mediaUrl + '\')">Copy Link</button>' +
          '<button onclick="closeShareOptions()">Close</button>' +
        '</div>';
      const shareContainer = document.getElementById('shareOptionsContainer');
      shareContainer.innerHTML = shareHTML;
      shareContainer.style.display = 'block';
    }
    function sharePhoto(platform, encodedUrl) {
      let shareUrl = '';
      switch(platform) {
        case 'whatsapp':
          shareUrl = 'https://api.whatsapp.com/send?text=' + encodedUrl;
          break;
        case 'facebook':
          shareUrl = 'https://www.facebook.com/sharer/sharer.php?u=' + encodedUrl;
          break;
        case 'twitter':
          shareUrl = 'https://twitter.com/intent/tweet?url=' + encodedUrl;
          break;
        default:
          return;
      }
      window.open(shareUrl, '_blank');
      fetch('/increment_share_count', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ media_id: currentMediaId })
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('shareCount').innerText = data.shares !== undefined ? data.shares : 0;
      })
      .catch(error => console.error('Error updating share count:', error));
      closeShareOptions();
    }
    function copyLink(url) {
      navigator.clipboard.writeText(url).then(() => {
        alert('Link copied to clipboard!');
      }).catch(err => {
        alert('Failed to copy: ' + err);
      });
    }
    function closeShareOptions() {
      document.getElementById('shareOptionsContainer').style.display = 'none';
    }

    // Comment functionality (simple prompt)
    function commentImage() {
      let comment = prompt("Enter your comment:");
      if (comment) {
        fetch('/add_comment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ media_id: currentMediaId, comment: comment })
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            alert("Comment added successfully!");
          } else {
            alert("Error adding comment: " + data.error);
          }
        })
        .catch(error => console.error('Error adding comment:', error));
      }
    }

    // Delete functionality
    function deleteImage() {
      if (confirm("Are you sure you want to delete this photo?")) {
        fetch('/delete_media/' + currentMediaId, {
          method: 'POST'
        })
        .then(response => {
          if (response.ok) {
            alert("Photo deleted successfully!");
            location.reload();
          } else {
            alert("Error deleting photo.");
          }
        })
        .catch(error => console.error('Error deleting image:', error));
      }
    }

    // Close modals when clicking outside modal content
    window.onclick = function(event) {
      const imageModal = document.getElementById('imageModal');
      const mediaModal = document.getElementById('mediaModal');
      const liveModal = document.getElementById('liveModal');
      if (event.target == imageModal) {
        closeImageModal();
      }
      if (event.target == mediaModal) {
        closeMediaOptions();
      }
      if (event.target == liveModal) {
        closeLiveModal();
      }
    };

    // History manipulation to redirect back arrow from profile page to photos page
    history.pushState(null, null, location.href);
    window.addEventListener('popstate', function () {
      window.location.href = "/photos";
    });

    // === Notification Badge Updates on Profile Page (for accepted friend requests) ===
    function updateNotificationCount() {
      fetch('/api/notifications')
        .then(response => response.json())
        .then(data => {
          const count = data.notifications ? data.notifications.length : 0;
          document.getElementById('notificationBellBadge').innerText = count;
        })
        .catch(error => console.error('Error fetching notifications:', error));
    }
    document.addEventListener('DOMContentLoaded', updateNotificationCount);

    // === Socket.IO for Real-Time Notifications and Chat Invitation ===
    const currentUserId = "{{ user_id }}";
    var socket = io();
    const roomName = "user_" + currentUserId;
    console.log("Joining room:", roomName);
    // Emit the "join" event so that the client joins room "user_<user_id>"
    socket.emit('join', { user_id: currentUserId });
    // Listen for the "joined" confirmation
    socket.on('joined', function(data) {
      console.log("Successfully joined room:", data.room);
    });
    // Listen for friend_request_accepted events (for senders)
    socket.on('friend_request_accepted', function(data) {
      console.log("Received friend_request_accepted event:", data);
      updateNotificationCount();
    });
    // Listen for new friend request events (for receivers)
    socket.on('new_friend_request', function(notification) {
      console.log("New friend request event received:", notification);
      updateNotificationCount();
    });
  </script>
  
  <!-- Load Socket.IO library (only once) -->
  <script src="/socket.io/socket.io.js"></script>
</body>
</html>
